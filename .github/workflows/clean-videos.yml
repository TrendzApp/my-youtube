name: Clean Videos Folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean videos folder
        run: |

          if [ -d "videos" ]; then
            rm -rf videos/*
          fi

          mkdir -p videos

      - name: Commit changes
        run: |

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add videos

          git commit -m "Clean videos folder" || echo "Nothing to commit"

          git push

