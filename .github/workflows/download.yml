name: Super Smart Downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs (one per line)"
        required: true
      parallel:
        description: "Parallel URL workers"
        default: "4"
        required: true

permissions:
  contents: write

jobs:
  downloader:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install tools
        run: |
          sudo apt update
          sudo apt install -y ffmpeg aria2 parallel jq curl grep sed zip
          python3 -m pip install -U yt-dlp

      - name: prepare
        run: |
          mkdir -p videos
          mkdir -p logs

          cat <<EOF > urls.txt
          ${{ github.event.inputs.urls }}
          EOF

          sed -i '/^\s*$/d' urls.txt

      - name: smart engine
        env:
          PARALLEL: ${{ github.event.inputs.parallel }}
        run: |

          sanitize() {
            echo "$1" | sed 's#[\\/:"*?<>|]#_#g' | cut -c1-120
          }

          split_large() {

            find "$1" -type f | while read f; do

              size=$(stat -c%s "$f")

              if [ "$size" -gt 95000000 ]; then

                dir=$(dirname "$f")
                base=$(basename "$f")

                cd "$dir"

                zip -s 95m -0 "$base.zip" "$base"

                rm -f "$base"

                cd - >/dev/null
              fi

            done
          }

          media_count() {

            find "$1" -type f \( \
            -iname "*.mp4" -o \
            -iname "*.mkv" -o \
            -iname "*.webm" -o \
            -iname "*.mp3" -o \
            -iname "*.m4a" \
            \) | wc -l
          }

          crawl_page() {

            URL="$1"

            TMP="page.html"

            curl -L -s "$URL" -o "$TMP"

            grep -Eo '(https?://[^"]+\.(mp4|m3u8|webm|mpd))' "$TMP" | sort -u

            grep -Eo 'src="https?://[^"]+"' "$TMP" \
            | cut -d'"' -f2 \
            | grep -E '(mp4|m3u8|webm|mpd)' \
            | sort -u

          }

          download_single() {

            URL="$1"

            TITLE=$(yt-dlp --get-title "$URL" 2>/dev/null | head -n1)

            [ -z "$TITLE" ] && TITLE="video_$(date +%s)"

            SAFE=$(sanitize "$TITLE")

            DIR="videos/$SAFE"

            mkdir -p "$DIR"

            BEFORE=$(media_count "$DIR")

            yt-dlp \
              --continue \
              --retries 40 \
              --fragment-retries 40 \
              --concurrent-fragments 8 \
              --downloader aria2c \
              --downloader-args "aria2c:-x 16 -k 1M" \
              --merge-output-format mp4 \
              -o "$DIR/%(title)s.%(ext)s" \
              "$URL" \
              > "$DIR/log.txt" 2>&1 || true

            AFTER=$(media_count "$DIR")

            if [ "$AFTER" -le "$BEFORE" ]; then
              return 1
            fi

            split_large "$DIR"
          }

          download_playlist() {

            URL="$1"

            NAME=$(yt-dlp --flat-playlist --print "%(playlist_title)s" "$URL" | head -n1)

            [ -z "$NAME" ] && NAME="playlist_$(date +%s)"

            SAFE=$(sanitize "$NAME")

            DIR="videos/$SAFE"

            mkdir -p "$DIR"

            yt-dlp \
              --yes-playlist \
              --continue \
              --retries 40 \
              --fragment-retries 40 \
              --concurrent-fragments 8 \
              --downloader aria2c \
              --downloader-args "aria2c:-x 16 -k 1M" \
              -o "$DIR/%(playlist_index)s-%(title)s.%(ext)s" \
              "$URL" \
              > "$DIR/log.txt" 2>&1 || true

            split_large "$DIR"
          }

          detect_type() {

            URL="$1"

            COUNT=$(yt-dlp --flat-playlist --dump-json "$URL" 2>/dev/null | wc -l)

            if [ "$COUNT" -gt 1 ]; then
              echo playlist
            else
              echo single
            fi
          }

          process_url() {

            URL="$1"

            echo "Processing $URL"

            TYPE=$(detect_type "$URL")

            if [ "$TYPE" = "playlist" ]; then

              echo "Playlist detected"

              download_playlist "$URL"

              return
            fi

            echo "Trying single video"

            if download_single "$URL"; then
              return
            fi

            echo "Trying crawl mode"

            LINKS=$(crawl_page "$URL")

            for L in $LINKS; do

              echo "Found media $L"

              download_single "$L" || true

            done

          }

          export -f sanitize
          export -f split_large
          export -f media_count
          export -f crawl_page
          export -f download_single
          export -f download_playlist
          export -f detect_type
          export -f process_url

          cat urls.txt | parallel -j $PARALLEL process_url {}

      - name: cleanup
        run: |
          find videos -type d -empty -delete

      - name: show files
        run: |
          find videos -type f

      - name: commit
        run: |

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add videos

          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "auto downloaded media"
            git push
          fi
