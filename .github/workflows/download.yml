name: Universal Downloader

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:

      url:
        description: "Video URL"
        required: true

      mode:
        description: "video or audio"
        required: true
        default: "video"

      quality:
        description: "best / 1080 / 720 / 480 / 360"
        required: true
        default: "best"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg zip
          pip install -U yt-dlp

      - name: Create videos folder
        run: |
          mkdir -p videos

      - name: Download media
        run: |

          URL="${{ github.event.inputs.url }}"
          QUALITY="${{ github.event.inputs.quality }}"

          if [ "$QUALITY" = "1080" ]; then
            FORMAT="bestvideo[height<=1080]+bestaudio/best[height<=1080]"
          elif [ "$QUALITY" = "720" ]; then
            FORMAT="bestvideo[height<=720]+bestaudio/best[height<=720]"
          elif [ "$QUALITY" = "480" ]; then
            FORMAT="bestvideo[height<=480]+bestaudio/best[height<=480]"
          elif [ "$QUALITY" = "360" ]; then
            FORMAT="bestvideo[height<=360]+bestaudio/best[height<=360]"
          else
            FORMAT="bv*+ba/b"
          fi

          TITLE=$(yt-dlp --get-title --restrict-filenames "$URL")

          mkdir -p "videos/$TITLE"

          if [ "${{ github.event.inputs.mode }}" = "audio" ]; then

            yt-dlp \
              --extract-audio \
              --audio-format mp3 \
              --audio-quality 0 \
              --restrict-filenames \
              --windows-filenames \
              --no-playlist \
              -o "videos/$TITLE/%(title)s.%(ext)s" \
              "$URL"

          else

            yt-dlp \
              -f "$FORMAT" \
              --merge-output-format mp4 \
              --restrict-filenames \
              --windows-filenames \
              --no-playlist \
              -o "videos/$TITLE/%(title)s.%(ext)s" \
              "$URL"

          fi

      - name: Split large files
        run: |

          find videos -type f | while read f; do

            size=$(stat -c%s "$f")

            if [ $size -gt 95000000 ]; then

              echo "Splitting $f"

              zip -s 95m "${f}.zip" "$f"

              rm "$f"

            fi

          done

      - name: Commit files to repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add videos/

          git commit -m "Add downloaded media" || echo "Nothing to commit"

          git push
