name: Universal Downloader

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:

      url:
        description: "Video URL"
        required: true

      mode:
        description: "video or audio"
        required: true
        default: "video"

      quality:
        description: "best / 1080 / 720 / 480 / 360"
        required: true
        default: "best"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg zip
          pip install -U yt-dlp

      - name: Create videos folder
        run: |
          mkdir -p videos

      - name: Download media
        run: |

          QUALITY="${{ github.event.inputs.quality }}"

          if [ "$QUALITY" = "1080" ]; then
            FORMAT="bestvideo[height<=1080]+bestaudio/best[height<=1080]"
          elif [ "$QUALITY" = "720" ]; then
            FORMAT="bestvideo[height<=720]+bestaudio/best[height<=720]"
          elif [ "$QUALITY" = "480" ]; then
            FORMAT="bestvideo[height<=480]+bestaudio/best[height<=480]"
          elif [ "$QUALITY" = "360" ]; then
            FORMAT="bestvideo[height<=360]+bestaudio/best[height<=360]"
          else
            FORMAT="bv*+ba/b"
          fi

          echo "Selected quality: $QUALITY"
          echo "Using format: $FORMAT"

          if [ "${{ github.event.inputs.mode }}" = "audio" ]; then

            yt-dlp \
              --extract-audio \
              --audio-format mp3 \
              --audio-quality 0 \
              --restrict-filenames \
              --windows-filenames \
              --no-playlist \
              --retries 10 \
              --fragment-retries 10 \
              --concurrent-fragments 4 \
              --user-agent "Mozilla/5.0" \
              -o "videos/%(title)s.%(ext)s" \
              "${{ github.event.inputs.url }}"

          else

            yt-dlp \
              -f "$FORMAT" \
              --merge-output-format mp4 \
              --restrict-filenames \
              --windows-filenames \
              --no-playlist \
              --retries 10 \
              --fragment-retries 10 \
              --concurrent-fragments 4 \
              --user-agent "Mozilla/5.0" \
              -o "videos/%(title)s.%(ext)s" \
              "${{ github.event.inputs.url }}"

          fi

      - name: Show downloaded files
        run: |
          echo "Downloaded files:"
          ls -lh videos

      - name: Split large files
        run: |

          cd videos

          for f in *; do

            if [ -f "$f" ]; then

              size=$(stat -c%s "$f")

              echo "Checking $f"

              if [ $size -gt 95000000 ]; then

                echo "Splitting $f into multi-part zip"

                zip -s 95m "${f}.zip" "$f"

                rm "$f"

              else

                echo "$f is under 95MB"

              fi

            fi

          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-files
          path: videos/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: release-${{ github.run_number }}
          name: release-${{ github.run_number }}
          files: videos/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
