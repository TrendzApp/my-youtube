name: Ultra Smart Downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs (one per line)"
        required: true

permissions:
  contents: write

jobs:
  downloader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt update && sudo apt install -y ffmpeg aria2 jq curl zip
          python3 -m pip install -U yt-dlp

      - name: Prepare
        run: |
          mkdir -p videos reports
          echo "${{ github.event.inputs.urls }}" > urls.txt
          sed -i '/^\s*$/d' urls.txt

      - name: Run Downloader
        run: |
          set -euo pipefail

          # تابع دانلود تک ویدیو
          download_single() {
            local URL="$1"
            local TITLE=$(yt-dlp --get-title "$URL" 2>/dev/null | head -n1 || echo "video_$(date +%s)")
            local SAFE=$(echo "$TITLE" | sed 's#[\\/:"*?<>|]#_#g' | cut -c1-100)
            local DIR="videos/$SAFE"
            mkdir -p "$DIR"

            echo "Downloading: $URL"
            yt-dlp \
              --continue --retries 30 --fragment-retries 30 \
              --downloader aria2c --downloader-args "aria2c:-x 16 -s 16 -k 1M" \
              --embed-metadata --write-info-json \
              -o "$DIR/%(title)s.%(ext)s" "$URL" > "$DIR/log.txt" 2>&1 || return 1
            
            # تقسیم فایل‌های بزرگ
            find "$DIR" -type f -size +95M -exec zip -s 95m -0 "{}.zip" "{}" \; -exec rm "{}" \;
          }

          # حلقه اصلی (جایگزین parallel برای جلوگیری از ارور)
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            download_single "$url" || echo "Failed to download $url" >> reports/errors.txt
          done < urls.txt

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add videos reports
          if ! git diff --cached --quiet; then
            git commit -m "auto download finished"
            git push
          else
            echo "Nothing new to commit."
          fi
