name: Ultimate Downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Video URLs (one per line)"
        required: true

      mode:
        description: "video or audio"
        required: true
        default: "video"

      quality:
        description: "best / 1080 / 720 / 480 / 360"
        required: true
        default: "best"

      threads:
        description: "Concurrent downloads"
        required: true
        default: "8"

permissions:
  contents: write

jobs:
  downloader:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            ffmpeg \
            zip \
            unzip \
            parallel \
            aria2 \
            jq

          python3 -m pip install -U pip
          python3 -m pip install -U yt-dlp

      - name: Prepare folders
        run: |
          mkdir -p videos
          mkdir -p temp

      - name: Save URLs
        run: |
          cat > urls.txt << 'EOF'
          ${{ github.event.inputs.urls }}
          EOF

      - name: Download videos
        env:
          MODE: ${{ github.event.inputs.mode }}
          QUALITY: ${{ github.event.inputs.quality }}
          THREADS: ${{ github.event.inputs.threads }}
        run: |

          sanitize_title() {
            echo "$1" \
            | sed 's#[\\/:"*?<>|]#_#g' \
            | tr -d '\r' \
            | cut -c1-120
          }

          get_format() {

            if [ "$QUALITY" = "best" ]; then
              echo "bv*+ba/b"
            else
              echo "bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}]"
            fi

          }

          split_large_files() {

            TARGET_DIR="$1"

            find "$TARGET_DIR" -type f | while read FILE; do

              SIZE=$(stat -c%s "$FILE")

              if [ "$SIZE" -gt 95000000 ]; then

                echo "Splitting: $FILE"

                DIR=$(dirname "$FILE")
                BASE=$(basename "$FILE")

                cd "$DIR"

                zip -s 95m -0 "${BASE}.zip" "$BASE"

                rm -f "$BASE"

                cd - >/dev/null

              fi

            done

          }

          download_one() {

            URL="$1"

            echo "===================================="
            echo "START: $URL"
            echo "===================================="

            TITLE=$(yt-dlp \
              --get-title \
              --user-agent "Mozilla/5.0" \
              "$URL" 2>/dev/null | head -n1)

            if [ -z "$TITLE" ]; then
              TITLE="video_$(date +%s)_$RANDOM"
            fi

            SAFE_TITLE=$(sanitize_title "$TITLE")

            TARGET_DIR="videos/$SAFE_TITLE"

            mkdir -p "$TARGET_DIR"

            if [ "$MODE" = "audio" ]; then

              yt-dlp \
                --ignore-errors \
                --no-playlist \
                --continue \
                --no-part \
                --retries 30 \
                --fragment-retries 30 \
                --retry-sleep 5 \
                --socket-timeout 30 \
                --extractor-retries 10 \
                --file-access-retries 10 \
                --concurrent-fragments 5 \
                --user-agent "Mozilla/5.0" \
                --extract-audio \
                --audio-format mp3 \
                --audio-quality 0 \
                --force-overwrites \
                -o "$TARGET_DIR/%(title)s.%(ext)s" \
                "$URL"

            else

              FORMAT=$(get_format)

              yt-dlp \
                --ignore-errors \
                --no-playlist \
                --continue \
                --no-part \
                --retries 30 \
                --fragment-retries 30 \
                --retry-sleep 5 \
                --socket-timeout 30 \
                --extractor-retries 10 \
                --file-access-retries 10 \
                --concurrent-fragments 5 \
                --user-agent "Mozilla/5.0" \
                --merge-output-format mp4 \
                --force-overwrites \
                -f "$FORMAT" \
                -o "$TARGET_DIR/%(title)s.%(ext)s" \
                "$URL"

            fi

            split_large_files "$TARGET_DIR"

            echo "DONE: $URL"

          }

          export -f sanitize_title
          export -f get_format
          export -f split_large_files
          export -f download_one

          cat urls.txt \
            | grep -v '^$' \
            | parallel -j "$THREADS" download_one {}

      - name: Cleanup empty folders
        run: |
          find videos -type d -empty -delete

      - name: Git status
        run: |
          git status

      - name: Commit and push
        run: |

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add videos/

          git commit -m "Add downloaded videos" || echo "Nothing to commit"

          git push

      - name: Final report
        run: |
          echo "===================================="
          echo "Download workflow completed"
          echo "===================================="

          find videos -type f
