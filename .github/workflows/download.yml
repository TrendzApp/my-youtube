name: Video Downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Video URLs (one per line)"
        required: true

      threads:
        description: "Concurrent downloads"
        required: true
        default: "6"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |

          sudo apt update
          sudo apt install -y ffmpeg aria2 zip parallel

          python3 -m pip install -U yt-dlp

      - name: Prepare folders
        run: |
          mkdir -p videos

      - name: Save URLs
        run: |

          cat > urls.txt << 'EOF'
          ${{ github.event.inputs.urls }}
          EOF

      - name: Download videos
        env:
          THREADS: ${{ github.event.inputs.threads }}
        run: |

          sanitize() {
            echo "$1" | sed 's#[\\/:"*?<>|]#_#g' | cut -c1-120
          }

          split_large() {

            DIR="$1"

            find "$DIR" -type f | while read f; do

              SIZE=$(stat -c%s "$f")

              if [ "$SIZE" -gt 95000000 ]; then

                cd "$(dirname "$f")"

                zip -s 95m -0 "$(basename "$f").zip" "$(basename "$f")"

                rm -f "$(basename "$f")"

                cd - >/dev/null

              fi

            done
          }

          download_one() {

            URL="$1"

            echo "Processing $URL"

            TITLE=$(yt-dlp --get-title "$URL" | head -n1)

            if [ -z "$TITLE" ]; then
              TITLE="video_$(date +%s)"
            fi

            SAFE=$(sanitize "$TITLE")

            DIR="videos/$SAFE"

            mkdir -p "$DIR"

            yt-dlp \
              --no-playlist \
              --retries 30 \
              --fragment-retries 30 \
              --retry-sleep 5 \
              --concurrent-fragments 5 \
              --downloader aria2c \
              --downloader-args "aria2c:-x 16 -k 1M" \
              --merge-output-format mp4 \
              -o "$DIR/%(title)s.%(ext)s" \
              "$URL"

            COUNT=$(find "$DIR" -type f | wc -l)

            if [ "$COUNT" -eq 0 ]; then
              echo "Download failed for $URL"
              exit 1
            fi

            split_large "$DIR"

          }

          export -f sanitize
          export -f split_large
          export -f download_one

          cat urls.txt | sed '/^\s*$/d' | parallel -j "$THREADS" download_one {}

      - name: Remove empty folders
        run: |
          find videos -type d -empty -delete

      - name: Commit
        run: |

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add videos/

          git commit -m "Add downloaded videos" || echo "Nothing new"

          git push
